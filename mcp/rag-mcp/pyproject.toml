[project]
name = "rag-mcp"
version = "0.1.0"
description = "Personal knowledge base MCP server — index documents and query them via semantic search"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.5",
    "httpx>=0.28.1",
    "mcp[cli]>=1.26.0",
    "pypdf>=6.8.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
# This lets you run the server with: uv run rag-mcp
rag-mcp = "rag_mcp.server:main"

[tool.uv]
# Tell uv where our source package lives
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_mcp"]
